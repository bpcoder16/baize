# 与 app.yaml 放在同一目录，配置 Gin 的可信代理、请求日志 ID 和访问日志。

trustedProxies: []  # 可信代理 IP 或 CIDR，空列表表示直接使用对端 IP

# 开启后，缺少 PIXIU-Log-Id 或值为空白的请求返回 HTTP 400。此规则也适用于探针和 CORS 预检。
requireLogID: false

loggerName: ""           # 对应 app.yaml 的 log.names，留空沿用请求上下文的日志配置
disableAccessLog: false  # 设为 true 关闭访问日志和详情采集，仍记录 panic

# 详情包含完整请求头或响应头及正文。开启请求详情前，应在 Gin 外层限制请求体大小和读取时间。
logRequestInfo: false   # 记录请求详情
logResponseInfo: false  # 记录响应详情

# 可选跨域策略，省略或空列表关闭。启用时取消下面的注释并填写实际来源。
# cors:
