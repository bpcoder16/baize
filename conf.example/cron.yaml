# 与 app.yaml 放在同一目录，由 cronboot.Service 读取。
loggerName: ""  # 留空使用默认日志。独立日志需在 app.yaml 的 log.names 和此处填写同一名称

# 可选 Redis 调度锁。同组副本共用 Redis 数据库、锁前缀和任务名，未获锁的副本跳过本轮。
# 启用时取消下列配置的注释。
# lock:
#   redisName: "default"        # 已初始化的 Redis 实例名
#   keyPrefix: "example:cron:"  # 不同应用或环境使用不同前缀
#   ttl: "30s"                  # 锁租期，默认 30s
#   renewInterval: "10s"        # 续租间隔，默认 ttl 的三分之一，须小于 ttl

# name 须与已注册的 Handler 名称完全一致，区分大小写。jobs: [] 清空配置中的任务，Prepare 登记的内置任务仍会运行。
# Baize 内置任务使用 baize. 前缀。业务 Handler 请使用其他名称。
# 每项只选 every、cron、randomEvery 中的一种。固定和随机间隔首次执行前都会等待。
# 同一进程内，同名任务仍在运行时跳过本轮。
# cron 按 env.timeLocation 解析，依次填写秒、分、时、日、月、周，不支持内嵌时区或 @daily。
# timeout 默认不限时，启用锁时须设置正时长。超时取消任务上下文，Handler 返回后释放锁。
# successLevel 可选 info（默认）或 debug。
jobs: []

# 启用示例时，用下面的 jobs 列表替换上面的空列表，并采用宿主已注册的任务名。
# jobs:
#   - name: "Heartbeat"
#     every: "1m"           # 固定间隔，每分钟一次，最短 100ms
#     timeout: "5s"
#     successLevel: "info"
#   - name: "DailyReport"
#     cron: "0 30 2 * * *"  # 每天 02:30 执行
#     timeout: "2m"
#     successLevel: "info"
#   - name: "RefreshCache"
#     randomEvery:          # 每轮重新选取间隔，范围为 [min, max)
#       min: "5m"           # 最短 100ms
#       max: "10m"          # 须大于 min
#     timeout: "30s"
#     successLevel: "debug"
